<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>成长</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --accent: #d97706;
      --ink: #92400e;
      --muted: #b45309;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #1a1208;
      color: #fff;
      overflow: hidden;
    }
    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #1a1208;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(26, 18, 8, 0.75) 0%, transparent 100%);
      pointer-events: none;
    }
    .topbar a,
    .topbar .counter {
      pointer-events: auto;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .home-link:active { transform: scale(0.97); }
    .counter {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }
    .track {
      height: 100%;
      display: flex;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .track.dragging { transition: none; }
    .slide {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1208;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 8;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .nav-btn:active { background: rgba(255, 255, 255, 0.3); }
    .nav-btn.prev { left: 10px; }
    .nav-btn.next { right: 10px; }
    .nav-btn:disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      padding: 16px 20px calc(18px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: linear-gradient(0deg, rgba(26, 18, 8, 0.8) 0%, transparent 100%);
    }
    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.35);
      padding: 0;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .dot.active {
      background: #fbbf24;
      transform: scale(1.25);
    }
    .play-btn {
      min-width: 120px;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      background: linear-gradient(145deg, #fbbf24, #d97706);
      color: #1a1208;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35);
    }
    .play-btn:active { transform: scale(0.97); }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: rgba(255, 255, 255, 0.7);
      padding: 40px 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <a class="home-link" href="../../index.html">‹ 返回首页</a>
      <div class="counter" id="counter">0 / 0</div>
    </div>

    <div class="stage" id="stage">
      <div class="track" id="track"></div>
      <button class="nav-btn prev" id="prevBtn" type="button" aria-label="上一张">‹</button>
      <button class="nav-btn next" id="nextBtn" type="button" aria-label="下一张">›</button>
    </div>

    <div class="controls">
      <div class="dots" id="dots"></div>
      <button class="play-btn" id="playBtn" type="button">自动播放</button>
    </div>
  </div>

  <script>
    (function () {
      // 成长相册：按文件名排序展示 images 目录图片
      var IMAGES = [
        'images/1.JPG',
        'images/2.JPG',
        'images/3.JPG',
        'images/4.JPG'
      ];

      var index = 0;
      var playing = false;
      var timer = null;
      var PLAY_MS = 3000;

      var track = document.getElementById('track');
      var dots = document.getElementById('dots');
      var counter = document.getElementById('counter');
      var prevBtn = document.getElementById('prevBtn');
      var nextBtn = document.getElementById('nextBtn');
      var playBtn = document.getElementById('playBtn');
      var stage = document.getElementById('stage');

      if (!IMAGES.length) {
        stage.innerHTML = '<div class="empty"><p>还没有成长照片</p><p>把图片放到 images 文件夹即可</p></div>';
        playBtn.style.display = 'none';
        return;
      }

      IMAGES.forEach(function (src, i) {
        var slide = document.createElement('div');
        slide.className = 'slide';
        var img = document.createElement('img');
        img.src = src;
        img.alt = '成长照片 ' + (i + 1);
        img.loading = i === 0 ? 'eager' : 'lazy';
        slide.appendChild(img);
        track.appendChild(slide);

        var dot = document.createElement('button');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.type = 'button';
        dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
        dot.addEventListener('click', function () {
          goTo(i);
          restartAuto();
        });
        dots.appendChild(dot);
      });

      function update() {
        track.style.transform = 'translateX(' + (-index * 100) + '%)';
        counter.textContent = (index + 1) + ' / ' + IMAGES.length;
        Array.prototype.forEach.call(dots.children, function (dot, i) {
          dot.classList.toggle('active', i === index);
        });
        prevBtn.disabled = index === 0 && !playing;
        nextBtn.disabled = index === IMAGES.length - 1 && !playing;
        if (playing) {
          prevBtn.disabled = false;
          nextBtn.disabled = false;
        }
      }

      function goTo(i) {
        if (i < 0) i = IMAGES.length - 1;
        if (i >= IMAGES.length) i = 0;
        index = i;
        update();
      }

      function stopAuto() {
        playing = false;
        clearInterval(timer);
        timer = null;
        playBtn.textContent = '自动播放';
        update();
      }

      function startAuto() {
        playing = true;
        playBtn.textContent = '暂停播放';
        clearInterval(timer);
        timer = setInterval(function () {
          goTo(index + 1);
        }, PLAY_MS);
        update();
      }

      function restartAuto() {
        if (playing) startAuto();
      }

      prevBtn.addEventListener('click', function () {
        goTo(index - 1);
        restartAuto();
      });
      nextBtn.addEventListener('click', function () {
        goTo(index + 1);
        restartAuto();
      });
      playBtn.addEventListener('click', function () {
        if (playing) stopAuto();
        else startAuto();
      });

      // 滑动切换
      var startX = 0;
      var startY = 0;
      var deltaX = 0;
      var dragging = false;
      var locked = false;

      stage.addEventListener('touchstart', function (e) {
        if (!e.touches.length) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        deltaX = 0;
        dragging = true;
        locked = false;
        track.classList.add('dragging');
      }, { passive: true });

      stage.addEventListener('touchmove', function (e) {
        if (!dragging || !e.touches.length) return;
        var dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if (!locked) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          locked = Math.abs(dx) > Math.abs(dy);
          if (!locked) {
            dragging = false;
            track.classList.remove('dragging');
            return;
          }
        }
        deltaX = dx;
        var width = stage.clientWidth || 1;
        var offset = (-index * 100) + (deltaX / width) * 100;
        track.style.transform = 'translateX(' + offset + '%)';
      }, { passive: true });

      stage.addEventListener('touchend', function () {
        if (!dragging) return;
        dragging = false;
        track.classList.remove('dragging');
        var threshold = (stage.clientWidth || 1) * 0.18;
        if (deltaX < -threshold) goTo(index + 1);
        else if (deltaX > threshold) goTo(index - 1);
        else update();
        restartAuto();
        deltaX = 0;
      });

      update();
      startAuto();
    })();
  </script>
</body>
</html>
